<div class="space-y-6 animate-in fade-in duration-500">

  <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b border-slate-100 gap-4">
    <!-- Título Principal -->
    <h2 class="text-xl font-black text-slate-800 tracking-tight">Rx y documentos</h2>

    <!-- Bloque de Controles (Filtros y Acciones) -->
    <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">

      <!-- Filtrar por usuario -->
      <div class="relative w-44">
        <select class="w-full bg-white border border-slate-200 text-slate-400 text-xs font-medium rounded-lg pl-3 pr-8 py-2.5 appearance-none focus:outline-none focus:border-slate-300 cursor-pointer">
          <option value="">Filtrar por usuario</option>
        </select>
        <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400 text-[10px]">
          ▼
        </div>
      </div>

      <!-- Filtrar por fecha -->
      <div class="relative w-44">
        <select class="w-full bg-white border border-slate-200 text-slate-400 text-xs font-medium rounded-lg pl-3 pr-8 py-2.5 appearance-none focus:outline-none focus:border-slate-300 cursor-pointer">
          <option value="">Filtrar por fecha</option>
        </select>
        <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400 text-[10px]">
          ▼
        </div>
      </div>

      <!-- Botón Subir Archivo (Oculta un input file real) -->
      <div class="relative">
        <button type="button" class="bg-[#0070f3] hover:bg-blue-600 text-white font-bold text-xs px-5 py-2.5 rounded-lg shadow-sm transition-all flex items-center justify-center">
          Subir archivo
        </button>
        <input
          type="file"
          multiple
          (change)="onFileSelected($event)"
          class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
        />
      </div>

      <!-- Icono de Información Circular Slate -->
      <button type="button" class="w-6 h-6 rounded-full bg-slate-200 hover:bg-slate-300 text-white flex items-center justify-center text-xs font-black transition-all" title="Ayuda y formatos soportados">
        i
      </button>

    </div>
  </div>

  <!-- 🗂️ Zona de Arrastre Interactiva con el Mensaje Exacto de la Imagen -->
  <div
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
    [class.border-blue-400]="isDragging()"
    [class.bg-blue-50]="isDragging()"
    class="border border-transparent hover:border-slate-100 rounded-3xl transition-all relative"
  >
    <!-- Entrada de archivos invisible sobre toda el área para capturar drops -->
    <input
      type="file"
      multiple
      (change)="onFileSelected($event)"
      class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
    />

    @if (archivos().length === 0) {
      <div class="flex flex-col items-center justify-center py-24 text-slate-400/80">
        <!-- Icono de Bandeja Gris Estilo Minimalista -->
        <div class="w-16 h-12 border-4 border-slate-300 rounded-2xl relative flex items-center justify-center mb-4 before:content-[''] before:absolute before:bottom-0 before:w-10 before:h-2 before:bg-slate-300 before:rounded-t-sm">
          <div class="absolute top-1 w-6 h-1 bg-slate-300 rounded-full"></div>
        </div>
        <p class="text-base font-medium tracking-wide text-slate-400/90 text-center px-4">
          Este paciente aún no cuenta con documentos, arrástrelos aquí para comenzar
        </p>
      </div>
    } @else {
      <!-- Grid de Archivos cuando existan elementos subidos -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-2">
        @for (archivo of archivos(); track archivo.id) {
          <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 relative overflow-hidden flex flex-col group animate-in zoom-in-95 duration-200">
            <!-- Vista Previa Temporal -->
            <div class="w-full h-32 bg-slate-900 rounded-xl overflow-hidden relative mb-3">
              <img [src]="archivo.url" alt="Preview" class="w-full h-full object-cover opacity-80">
              <span class="absolute top-2 left-2 bg-slate-900/80 backdrop-blur-md text-[9px] font-black text-white px-2 py-0.5 rounded-md uppercase tracking-wider">
                {{ archivo.tipo }}
              </span>
            </div>

            <!-- Datos del Documento -->
            <div class="flex-1">
              <p class="text-xs font-bold text-slate-700 truncate" [title]="archivo.nombre">{{ archivo.nombre }}</p>
              <div class="flex items-center justify-between mt-1 text-[10px] text-slate-400 font-medium">
                <span>{{ archivo.fecha }}</span>
                <span>{{ archivo.tamano }}</span>
              </div>
            </div>

            <!-- Acciones Rápidas flotantes -->
            <button
              (click)="eliminarArchivo(archivo.id)"
              class="absolute top-3 right-3 w-7 h-7 rounded-lg bg-red-50 hover:bg-red-100 text-red-500 flex items-center justify-center text-xs transition-all opacity-0 group-hover:opacity-100 z-20 shadow-sm"
            >
              🗑️
            </button>

          </div>

        }
      </div>
    }
  </div>
</div>
