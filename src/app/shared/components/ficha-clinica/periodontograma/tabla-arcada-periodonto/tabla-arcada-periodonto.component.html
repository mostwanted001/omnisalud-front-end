<div class="flex flex-col w-[932px] bg-white select-none mb-3">

  <div class="w-full bg-slate-100 border-t border-x border-slate-200 rounded-t-md px-4 py-2 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa fa-th-list text-slate-400 text-xs"></i>
      <span class="font-bold text-slate-700 text-[11px] uppercase tracking-wider">
        {{ tituloArcada }}
      </span>
    </div>


  </div>

  <div class="flex items-stretch bg-white border-x border-b border-slate-200 rounded-b-md">

    <div class="w-36 mr-2 flex-shrink-0 flex flex-col font-normal text-slate-700 text-[13px] text-left overflow-hidden">
      <div class="bg-white font-bold border-b border-slate-200 h-9 flex items-center px-3 text-slate-800"># Pieza</div>
      <div class="border-b border-slate-200 h-9 flex items-center px-3 text-blue-600">Profundidad Surco</div>
      <div class="border-b border-slate-200 h-9 flex items-center px-3 text-rose-600">Margen</div>
      <div class="border-b border-slate-200 h-9 flex items-center px-3 bg-white font-bold text-slate-900">NIC</div>
      <div class="border-b border-slate-200 h-9 flex items-center px-3">Furca</div>
      <div class="border-b border-slate-200 h-10 flex items-center px-3">Exudado</div>
      <div class="border-b border-slate-200 h-10 flex items-center px-3">Sangramiento</div>
      <div class="h-9 flex items-center px-3">Movilidad</div>
    </div>

    <div class="w-[788px] flex-shrink-0 flex items-stretch overflow-hidden">

      <div class="flex items-stretch w-[387px] flex-shrink-0">
        @for (pieza of piezasIzquierda; track pieza) {
          <app-columna-diente
            [numeroPieza]="pieza"
            [formGroupCita]="getDienteForm(pieza)"
            [style.--diente-ancho]="getDienteAnchoPx(pieza)"
            [formArcada]="formArcada"
            [cara]="cara">
          </app-columna-diente>
        }
      </div>



      <div class="flex items-stretch w-[387px] flex-shrink-0">
        @for (pieza of piezasDerecha; track pieza) {
          <app-columna-diente
            [numeroPieza]="pieza"
            [formGroupCita]="getDienteForm(pieza)"
            [style.--diente-ancho]="getDienteAnchoPx(pieza)"
            [formArcada]="formArcada"
            [cara]="cara">
          </app-columna-diente>
        }
      </div>

    </div>
  </div>
</div>
