<div class="w-full bg-white rounded-xl border border-slate-100 p-3 select-none">

  <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
    <div>
      <h3 class="text-base font-black text-slate-900 tracking-tighter uppercase italic flex items-center gap-2">
        <i class="fa-solid fa-tooth text-blue-600"></i>
        Examen Periodontal
      </h3>
      <p class="text-[11px] text-slate-400 font-medium">Complete los niveles basales de soporte periodontal.</p>
    </div>

    <div class="flex items-center gap-2">
      <button type="button" class="px-3 py-1.5 text-xs font-bold text-slate-600 bg-slate-50 hover:bg-slate-100 rounded-lg transition-all border border-slate-200/60 flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-clock-rotate-left text-slate-400"></i> Historial
      </button>
      <button type="button" class="px-3.5 py-1.5 text-xs font-black text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-md shadow-blue-100 transition-all flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-floppy-disk"></i> Guardar
      </button>
    </div>
  </div>

  <div class="space-y-4 p-4 bg-slate-50">

    <app-tabla-arcada-periodonto
      [esSuperior]="true"
      cara="vestibular"
      tituloArcada="Maxilar Superior"
      [formArcada]="formGroupCita"
      [piezasIzquierda]="['1.8', '1.7', '1.6', '1.5', '1.4', '1.3', '1.2', '1.1']"
      [piezasDerecha]="['2.1', '2.2', '2.3', '2.4', '2.5', '2.6', '2.7', '2.8']">
    </app-tabla-arcada-periodonto>

    <div class="flex items-stretch bg-white w-[932px] justify-start select-none">

      <div class="w-36 flex-shrink-0 flex flex-col justify-around font-bold text-slate-500 text-[11px] px-3 bg-slate-50 border border-slate-200 rounded-l-md text-left h-[300px]">
        <div class="h-1/2 flex justify-center items-center">Vestibular</div>
        <div class="h-1/2 flex justify-center items-center">Palatina</div>
      </div>

      <div class="w-[788px] flex-shrink-0 border-y border-r border-slate-200 rounded-r-md bg-white overflow-hidden h-[300px] relative">

        <img src="assets/periodontograma/periodontograma_arcada_superior.png"
             class="w-full h-full object-fill absolute inset-0 pointer-events-none px-[2px]"
             alt="Arcada Superior Completa">

        <app-grafico-arcada
        class="absolute inset-0 w-full h-full z-10 pointer-events-none"
        [formArcada]="formGroupCita"
        [piezasIzquierda]="['1.8', '1.7', '1.6', '1.5', '1.4', '1.3', '1.2', '1.1']"
        [piezasDerecha]="['2.1', '2.2', '2.3', '2.4', '2.5', '2.6', '2.7', '2.8']"
        [esSuperior]="true">
      </app-grafico-arcada>
      </div>
    </div>


    <div>
      <app-tabla-arcada-periodonto
      [esSuperior]="true"
      cara="palatina"
      tituloArcada=""
      [formArcada]="formGroupCita"
      [piezasIzquierda]="['1.8', '1.7', '1.6', '1.5', '1.4', '1.3', '1.2', '1.1']"
      [piezasDerecha]="['2.1', '2.2', '2.3', '2.4', '2.5', '2.6', '2.7', '2.8']">
    </app-tabla-arcada-periodonto>
    </div>
  </div>


  <div class="space-y-4 p-4 bg-slate-50">

    <app-tabla-arcada-periodonto
      tituloArcada="Maxilar Inferior"
      [esSuperior]="false"
      cara="vestibular"
      [formArcada]="formGroupCita"
      [piezasIzquierda]="['4.8', '4.7', '4.6', '4.5', '4.4', '4.3', '4.2', '4.1']"
      [piezasDerecha]="['3.1', '3.2', '3.3', '3.4', '3.5', '3.6', '3.7', '3.8']">
    </app-tabla-arcada-periodonto>


      <div class="flex items-stretch bg-white w-[932px] justify-start select-none">

        <div class="w-36 flex-shrink-0 flex flex-col justify-around font-bold text-slate-500 text-[11px] px-3 bg-slate-50 border border-slate-200 rounded-l-md text-left h-[300px]">
          <div class="h-1/2 flex justify-center items-center">Vestibular</div>
          <div class="h-1/2 flex justify-center items-center">Lingual</div>
        </div>

        <div class="w-[788px] flex-shrink-0 border-y border-r border-slate-200 rounded-r-md bg-white overflow-hidden h-[300px] relative">

          <img src="assets/periodontograma/periodontograma_arcada_inferior.png"
               class="w-full h-full object-fill absolute inset-0 pointer-events-none px-[2px]"
               alt="Arcada Superior Completa">

               <app-grafico-arcada
        class="absolute inset-0 w-full h-full z-10 pointer-events-none"
        [formArcada]="formGroupCita"
        [piezasIzquierda]="['4.8', '4.7', '4.6', '4.5', '4.4', '4.3', '4.2', '4.1']"
        [piezasDerecha]="['3.1', '3.2', '3.3', '3.4', '3.5', '3.6', '3.7', '3.8']"
        [esSuperior]="false">
      </app-grafico-arcada>
        </div>
      </div>

    <div>
      <app-tabla-arcada-periodonto
      tituloArcada=""
      [formArcada]="formGroupCita"
      cara="palatina"
      [esSuperior]="false"
      [piezasIzquierda]="['4.8', '4.7', '4.6', '4.5', '4.4', '4.3', '4.2', '4.1']"
      [piezasDerecha]="['3.1', '3.2', '3.3', '3.4', '3.5', '3.6', '3.7', '3.8']">
    </app-tabla-arcada-periodonto>
    </div>



</div>
